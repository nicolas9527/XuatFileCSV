<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Xuất CSV thủ công</title>
  <style>
    :root{
      --bg:#f3f6fb; --card:#fff; --text:#0f172a; --muted:#64748b;
      --primary:#1976d2; --danger:#dc2626; --border:rgba(15,23,42,.12);
      --shadow:0 12px 35px rgba(2,6,23,.10);
    }
    *{box-sizing:border-box}
    body{margin:0; font-family:-apple-system,system-ui,Arial; background:var(--bg); color:var(--text); padding:14px;}
    .wrap{max-width:720px; margin:0 auto;}
    h1{margin:6px 0 12px; font-size:18px; font-weight:1000; text-align:center; color:var(--primary);}
    .card{background:var(--card); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); padding:14px; margin-bottom:12px;}
    .tabs{display:flex; gap:8px; margin-bottom:10px;}
    .tab{
      flex:1; height:42px; border-radius:12px; border:1px solid var(--border);
      background:#fff; font-weight:1000; cursor:pointer;
    }
    .tab.active{background:var(--primary); color:#fff; border-color:transparent;}
    .grid{display:grid; grid-template-columns:1.2fr 2fr 1.1fr; gap:10px;}
    @media (max-width:560px){ .grid{grid-template-columns:1fr} }

    label{display:block; font-size:12px; font-weight:900; color:var(--muted); margin:0 0 6px 6px;}

    /* input + nút dán */
    .field{ position:relative; }
    input{
      width:100%; height:46px; border-radius:12px; border:1px solid var(--border);
      padding:0 44px 0 12px; font-size:15px; outline:none; background:#fff;
    }
    input:focus{border-color:rgba(25,118,210,.6)}
    .paste-btn{
      position:absolute;
      right:8px; top:50%; transform:translateY(-50%);
      height:32px; min-width:34px;
      border-radius:10px;
      border:1px solid rgba(15,23,42,.12);
      background:#eef2f7;
      font-weight:1000;
      cursor:pointer;
      padding:0 10px;
      display:flex; align-items:center; justify-content:center;
      -webkit-tap-highlight-color:transparent;
    }
    .paste-btn:active{ transform:translateY(-50%) scale(0.97); }

    .row{display:flex; gap:10px; margin-top:10px; flex-wrap:wrap;}
    .btn{
      height:44px; border:none; border-radius:12px; font-weight:1000;
      padding:0 14px; cursor:pointer;
    }
    .btn.primary{background:var(--primary); color:#fff;}
    .btn.gray{background:#e2e8f0; color:#0f172a;}
    .btn.danger{background:var(--danger); color:#fff;}
    .hint{font-size:12px; font-weight:800; color:var(--muted); margin-top:8px;}

    table{width:100%; border-collapse:separate; border-spacing:0; margin-top:12px; overflow:hidden; border:1px solid var(--border); border-radius:14px;}
    thead th{
      text-align:left; font-size:12px; letter-spacing:.2px; color:#334155;
      background:#f8fafc; padding:10px 10px; font-weight:1000; border-bottom:1px solid var(--border);
    }
    tbody td{padding:10px; border-bottom:1px solid rgba(15,23,42,.08); font-size:14px;}
    tbody tr:last-child td{border-bottom:none;}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace; font-size:12px;}
    .right{ text-align:right; }
    .small{font-size:12px; color:var(--muted); font-weight:800;}
    .toast{
      position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
      background:rgba(17,24,39,.92); color:#fff; padding:10px 14px; border-radius:14px;
      font-weight:900; font-size:13px; display:none; z-index:999; max-width:92%; text-align:center;
    }
  </style>
</head>
<body>
<div class="wrap">
  <h1>📤 Xuất CSV thủ công</h1>

  <div class="card">
    <div class="tabs">
      <button id="tabProducts" class="tab active" type="button">📦 DS Sản phẩm</button>
      <button id="tabChecked" class="tab" type="button">📅 DS Đã kiểm</button>
    </div>

    <!-- FORM -->
    <div id="formProducts">
      <div class="grid">
        <div>
          <label>SKU / Barcode</label>
          <div class="field">
            <input id="pSku" inputmode="numeric" placeholder="VD: 893..." />
            <button class="paste-btn" type="button" data-paste="pSku" title="Dán nhanh">📋</button>
          </div>
        </div>
        <div>
          <label>Tên sản phẩm</label>
          <div class="field">
            <input id="pName" placeholder="Nhập tên..." />
            <button class="paste-btn" type="button" data-paste="pName" title="Dán nhanh">📋</button>
          </div>
        </div>
        <div>
          <label>&nbsp;</label>
          <button id="pAdd" class="btn primary" type="button" style="width:100%">➕ Thêm</button>
        </div>
      </div>
      <div class="row">
        <button id="pExport" class="btn primary" type="button">📤 Xuất CSV sản phẩm</button>
        <button id="pClear" class="btn danger" type="button">🧹 Xoá hết</button>
      </div>
      <div class="hint">Không cho trùng SKU. Nếu nhập lại cùng SKU → tự cập nhật tên. (Có thể dán dạng: <b>SKU, Tên</b> để tự tách)</div>
      <div id="pTableWrap"></div>
    </div>

    <div id="formChecked" style="display:none">
      <div class="grid">
        <div>
          <label>SKU / Barcode</label>
          <div class="field">
            <input id="cSku" inputmode="numeric" placeholder="VD: 893..." />
            <button class="paste-btn" type="button" data-paste="cSku" title="Dán nhanh">📋</button>
          </div>
        </div>
        <div>
          <label>Tên sản phẩm</label>
          <div class="field">
            <input id="cName" placeholder="Nhập tên..." />
            <button class="paste-btn" type="button" data-paste="cName" title="Dán nhanh">📋</button>
          </div>
        </div>
        <div>
          <label>HSD</label>
          <div class="field">
            <input id="cHsd" type="date" />
            <button class="paste-btn" type="button" data-paste="cHsd" title="Dán nhanh">📋</button>
          </div>
        </div>
      </div>
      <div class="row">
        <button id="cAdd" class="btn primary" type="button">➕ Thêm</button>
        <button id="cExport" class="btn primary" type="button">📤 Xuất CSV đã kiểm</button>
        <button id="cClear" class="btn danger" type="button">🧹 Xoá hết</button>
      </div>
      <div class="hint">Không cho trùng theo (SKU + HSD). Nếu nhập lại y hệt → tự cập nhật tên. (Có thể dán: <b>SKU, Tên, HSD</b>)</div>
      <div id="cTableWrap"></div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
(() => {
  // ===== Helpers =====
  const $ = (id) => document.getElementById(id);
  const toastEl = $('toast');
  const toast = (msg, ms=1400) => {
    toastEl.textContent = msg;
    toastEl.style.display = 'block';
    clearTimeout(toast._t);
    toast._t = setTimeout(()=> toastEl.style.display='none', ms);
  };
  const trim = (s) => (s ?? '').toString().trim();

  const KEY_PRODUCTS = 'csv_manual_products_v1'; // [{sku,name}]
  const KEY_CHECKED  = 'csv_manual_checked_v1';  // [{sku,name,hsd}]

  const validISODate = (iso) => /^\d{4}-\d{2}-\d{2}$/.test(iso) && !isNaN(new Date(iso+'T12:00:00').getTime());

  function load(key, fallback){
    try{
      const v = JSON.parse(localStorage.getItem(key) || '');
      return Array.isArray(v) ? v : fallback;
    }catch{ return fallback; }
  }
  function save(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); return true; }
    catch{ toast('❌ Không lưu được (localStorage bị chặn)'); return false; }
  }

  function toCSVCell(v){
    v = (v ?? '').toString();
    const needs = /[",;\n\r]/.test(v);
    v = v.replace(/"/g, '""');
    return needs ? `"${v}"` : v;
  }

  function downloadCSV(filename, headerCols, rows){
    const BOM = '\uFEFF';
    let csv = BOM + headerCols.join(',') + '\n';
    rows.forEach(r => {
      csv += headerCols.map(k => toCSVCell(r[k] ?? '')).join(',') + '\n';
    });
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.rel = 'noopener';
    a.click();
    setTimeout(()=> URL.revokeObjectURL(url), 1200);
  }

  // ===== Smart parse from clipboard =====
  function splitSmart(text){
    let t = trim(text).replace(/\r/g,'').split('\n').join(' ').trim();
    if(!t) return [];

    // Ưu tiên tab trước (copy từ sheet)
    if(t.includes('\t')) return t.split('\t').map(x=>trim(x)).filter(Boolean);

    // Nếu có dấu phẩy
    if(t.includes(',')) return t.split(',').map(x=>trim(x)).filter(Boolean);

    // Nếu có ; (csv kiểu VN)
    if(t.includes(';')) return t.split(';').map(x=>trim(x)).filter(Boolean);

    // Nếu có nhiều khoảng trắng -> tách nhẹ (2+ spaces)
    if(/\s{2,}/.test(t)) return t.split(/\s{2,}/).map(x=>trim(x)).filter(Boolean);

    return [t];
  }

  function normalizeDateToISO(v){
    v = trim(v);
    if(!v) return '';
    if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;

    // dd/mm/yyyy
    let m = v.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if(m){
      const dd=String(m[1]).padStart(2,'0');
      const mm=String(m[2]).padStart(2,'0');
      const yy=m[3];
      return `${yy}-${mm}-${dd}`;
    }
    // yyyy/mm/dd
    m = v.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
    if(m){
      const yy=m[1];
      const mm=String(m[2]).padStart(2,'0');
      const dd=String(m[3]).padStart(2,'0');
      return `${yy}-${mm}-${dd}`;
    }
    const d = new Date(v);
    if(!isNaN(d.getTime())){
      const yy=d.getFullYear();
      const mm=String(d.getMonth()+1).padStart(2,'0');
      const dd=String(d.getDate()).padStart(2,'0');
      return `${yy}-${mm}-${dd}`;
    }
    return '';
  }

  async function readClipboardText(){
    try{
      const t = await navigator.clipboard.readText();
      return trim(t);
    }catch{
      toast('⚠️ Clipboard bị chặn (hãy bấm nút 📋)');
      return '';
    }
  }

  // Dán vào 1 ô
  async function pasteInto(inputId){
    const el = $(inputId);
    if(!el) return;
    const t = await readClipboardText();
    if(!t) return;

    // Nếu ô là date, cố normalize
    if(el.type === 'date'){
      const iso = normalizeDateToISO(t);
      if(validISODate(iso)){
        el.value = iso;
        toast('📋 Đã dán HSD');
      }else{
        toast('⚠️ HSD không hợp lệ');
      }
      return;
    }

    el.value = t;
    toast('📋 Đã dán');
    el.focus();
  }

  // Dán thông minh theo form (tự điền nhiều ô)
  async function smartPasteProducts(){
    const t = await readClipboardText();
    if(!t) return;
    const parts = splitSmart(t);
    // 기대: SKU, NAME
    if(parts.length >= 2){
      $('pSku').value = parts[0] || '';
      $('pName').value = parts.slice(1).join(' ') || '';
      toast('📋 Đã dán SKU + Tên');
      $('pName').focus();
    }else{
      $('pSku').value = parts[0] || t;
      toast('📋 Đã dán SKU');
      $('pName').focus();
    }
  }

  async function smartPasteChecked(){
    const t = await readClipboardText();
    if(!t) return;
    const parts = splitSmart(t);
    // 기대: SKU, NAME, HSD
    if(parts.length >= 3){
      $('cSku').value = parts[0] || '';
      $('cName').value = parts[1] || '';
      const iso = normalizeDateToISO(parts[2] || '');
      if(validISODate(iso)) $('cHsd').value = iso;
      toast('📋 Đã dán SKU + Tên + HSD');
      $('cHsd').focus();
      return;
    }
    if(parts.length === 2){
      $('cSku').value = parts[0] || '';
      $('cName').value = parts[1] || '';
      toast('📋 Đã dán SKU + Tên');
      $('cHsd').focus();
      return;
    }
    $('cSku').value = parts[0] || t;
    toast('📋 Đã dán SKU');
    $('cName').focus();
  }

  // (Tuỳ chọn) Dán tự động khi focus (OFF mặc định)
  const AUTO_PASTE_ON_FOCUS = false;

  // ===== State =====
  let products = load(KEY_PRODUCTS, []);
  let checked  = load(KEY_CHECKED,  []);

  // ===== Tabs =====
  const tabProducts = $('tabProducts');
  const tabChecked  = $('tabChecked');
  const formProducts = $('formProducts');
  const formChecked  = $('formChecked');

  function setTab(which){
    const isP = which === 'p';
    tabProducts.classList.toggle('active', isP);
    tabChecked.classList.toggle('active', !isP);
    formProducts.style.display = isP ? '' : 'none';
    formChecked.style.display  = isP ? 'none' : '';
    render();
  }
  tabProducts.onclick = () => setTab('p');
  tabChecked.onclick  = () => setTab('c');

  // ===== Render =====
  function renderProducts(){
    const wrap = $('pTableWrap');
    if(products.length === 0){
      wrap.innerHTML = `<div class="small" style="padding:12px 6px">Chưa có dữ liệu sản phẩm.</div>`;
      return;
    }
    const rows = [...products].sort((a,b)=> a.sku.localeCompare(b.sku));
    wrap.innerHTML = `
      <table>
        <thead>
          <tr>
            <th style="width:140px">SKU</th>
            <th>Tên sản phẩm</th>
            <th class="right" style="width:90px">Xoá</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(r=>`
            <tr>
              <td class="mono">${r.sku}</td>
              <td>${r.name || ''}</td>
              <td class="right"><button class="btn danger" style="height:34px;border-radius:10px;padding:0 10px" data-del-p="${r.sku}">🗑️</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      <div class="small" style="margin-top:8px">Tổng: <b>${rows.length}</b></div>
    `;
    wrap.querySelectorAll('[data-del-p]').forEach(btn=>{
      btn.onclick = () => {
        const sku = btn.getAttribute('data-del-p');
        products = products.filter(x => x.sku !== sku);
        save(KEY_PRODUCTS, products);
        render();
        toast('🗑️ Đã xoá');
      };
    });
  }

  function renderChecked(){
    const wrap = $('cTableWrap');
    if(checked.length === 0){
      wrap.innerHTML = `<div class="small" style="padding:12px 6px">Chưa có dữ liệu đã kiểm.</div>`;
      return;
    }
    const rows = [...checked].sort((a,b)=> (a.hsd||'').localeCompare(b.hsd||'') || a.sku.localeCompare(b.sku));
    wrap.innerHTML = `
      <table>
        <thead>
          <tr>
            <th style="width:140px">SKU</th>
            <th>Tên</th>
            <th style="width:110px">HSD</th>
            <th class="right" style="width:90px">Xoá</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(r=>`
            <tr>
              <td class="mono">${r.sku}</td>
              <td>${r.name || ''}</td>
              <td class="mono">${r.hsd || ''}</td>
              <td class="right"><button class="btn danger" style="height:34px;border-radius:10px;padding:0 10px" data-del-c="${r.sku}__${r.hsd}">🗑️</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      <div class="small" style="margin-top:8px">Tổng: <b>${rows.length}</b></div>
    `;
    wrap.querySelectorAll('[data-del-c]').forEach(btn=>{
      btn.onclick = () => {
        const key = btn.getAttribute('data-del-c');
        const [sku, hsd] = key.split('__');
        checked = checked.filter(x => !(x.sku===sku && x.hsd===hsd));
        save(KEY_CHECKED, checked);
        render();
        toast('🗑️ Đã xoá');
      };
    });
  }

  function render(){
    renderProducts();
    renderChecked();
  }

  // ===== Add product =====
  $('pAdd').onclick = () => {
    const sku = trim($('pSku').value);
    const name = trim($('pName').value);
    if(!sku){ toast('⚠️ Nhập SKU'); $('pSku').focus(); return; }

    const ex = products.find(x => x.sku === sku);
    if(ex){
      ex.name = name || ex.name || '';
      toast('✅ Đã cập nhật SKU');
    }else{
      products.push({sku, name});
      toast('✅ Đã thêm');
    }
    save(KEY_PRODUCTS, products);
    $('pSku').value=''; $('pName').value='';
    $('pSku').focus();
    render();
  };

  $('pExport').onclick = () => {
    const rows = [...products].sort((a,b)=> a.sku.localeCompare(b.sku));
    downloadCSV('danh_sach_san_pham.csv', ['sku','name'], rows);
    toast('📤 Đã xuất CSV');
  };

  $('pClear').onclick = () => {
    if(!confirm('Xoá toàn bộ danh sách sản phẩm?')) return;
    products = [];
    save(KEY_PRODUCTS, products);
    render();
    toast('🧹 Đã xoá');
  };

  // ===== Add checked =====
  $('cAdd').onclick = () => {
    const sku = trim($('cSku').value);
    const name = trim($('cName').value);
    const hsd = trim($('cHsd').value);
    if(!sku){ toast('⚠️ Nhập SKU'); $('cSku').focus(); return; }

    const iso = normalizeDateToISO(hsd);
    if(!validISODate(iso)){ toast('⚠️ Chọn HSD'); $('cHsd').focus(); return; }

    const ex = checked.find(x => x.sku === sku && x.hsd === iso);
    if(ex){
      ex.name = name || ex.name || '';
      toast('✅ Đã cập nhật dòng');
    }else{
      checked.push({sku, name, hsd: iso});
      toast('✅ Đã thêm');
    }
    save(KEY_CHECKED, checked);

    $('cSku').value=''; $('cName').value=''; $('cHsd').value='';
    $('cSku').focus();
    render();
  };

  $('cExport').onclick = () => {
    const rows = [...checked].sort((a,b)=> (a.hsd||'').localeCompare(b.hsd||'') || a.sku.localeCompare(b.sku));
    downloadCSV('danh_sach_da_kiem.csv', ['sku','name','hsd'], rows);
    toast('📤 Đã xuất CSV');
  };

  $('cClear').onclick = () => {
    if(!confirm('Xoá toàn bộ danh sách đã kiểm?')) return;
    checked = [];
    save(KEY_CHECKED, checked);
    render();
    toast('🧹 Đã xoá');
  };

  // ===== Paste buttons =====
  document.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-paste]');
    if(!b) return;
    const id = b.getAttribute('data-paste');

    // Dán thông minh cho form:
    if(id === 'pSku') return smartPasteProducts();
    if(id === 'cSku') return smartPasteChecked();

    // Dán thường cho ô còn lại
    return pasteInto(id);
  });

  // ===== Optional: auto paste on focus =====
  if(AUTO_PASTE_ON_FOCUS){
    ['pSku','pName','cSku','cName','cHsd'].forEach(id=>{
      const el = $(id);
      if(!el) return;
      el.addEventListener('focus', async ()=>{
        // chỉ auto paste nếu ô đang rỗng để tránh ghi đè
        if(trim(el.value)) return;
        // auto paste: cSku/pSku dùng smart
        if(id === 'pSku') return smartPasteProducts();
        if(id === 'cSku') return smartPasteChecked();
        return pasteInto(id);
      });
    });
  }

  // init
  render();
})();
</script>
</body>
</html>
